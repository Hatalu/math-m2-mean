<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภารกิจแบ่งปันให้เท่ากัน | ค่าเฉลี่ย ม.2</title>
<link rel="stylesheet" href="style.css">
<style>
  .groups { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(12px, 2.5vw, 36px); }
  .group { display: flex; flex-direction: column; align-items: center; gap: 2.5vh; padding: 2.5vh 10px;
    background: #fff; border-top: 10px solid var(--c); }
  .group { transform: rotate(var(--gr)); }
  .pile { display: grid; grid-template-columns: repeat(3, 10.5vh); gap: .8vh; justify-content: center; }
  .pile img { width: 10.5vh; height: 10.5vh; cursor: pointer; transform: rotate(var(--r));
    filter: var(--f) drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
  .ask { flex: none; align-self: center; margin-top: 3vh; font-size: clamp(1.1rem, 4vh, 2.2rem); transform: rotate(-1deg); box-shadow: var(--shadow); }

  /* ---- motion: title swings in, cards rise, number cards pop, buttons drop in one by one,
          then everything idles gently. --d = start delay set per element by the script ---- */
  h1 span { animation: swing 1s cubic-bezier(.3, 1.5, .5, 1) both; transform-origin: top center; }
  .group { animation: rise .7s cubic-bezier(.3, 1.4, .5, 1) both var(--d); }
  .num { animation: pop .6s cubic-bezier(.3, 1.8, .5, 1) both var(--d), bob 2.6s ease-in-out infinite alternate calc(var(--d) + .6s); }
  .pile img { animation: drop .65s cubic-bezier(.3, 1.5, .5, 1) both var(--d), wobble 2.4s ease-in-out infinite alternate calc(var(--d) + .65s); }
  .ask { animation: slideUp .7s cubic-bezier(.3, 1.5, .5, 1) both var(--d), breathe 1.8s ease-in-out infinite alternate calc(var(--d) + .7s); }
  .deco { animation: float 3s ease-in-out infinite alternate; }
  .deco + .deco { animation-delay: -1.5s; }

  @keyframes swing { from { transform: rotate(-1.5deg) translateY(-120%) rotate(-12deg); opacity: 0; } to { transform: rotate(-1.5deg); opacity: 1; } }
  @keyframes rise { from { transform: translateY(60vh) rotate(calc(var(--gr) * 8)); } to { transform: rotate(var(--gr)); } }
  @keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(-3deg); } }
  @keyframes bob { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(2deg) translateY(-6px); } }
  @keyframes drop { from { transform: translateY(-30vh) rotate(calc(var(--r) - 200deg)) scale(.6); opacity: 0; }
                    to { transform: rotate(var(--r)); opacity: 1; } }
  @keyframes wobble { from { transform: rotate(calc(var(--r) - 6deg)); } to { transform: rotate(calc(var(--r) + 6deg)) translateY(-3px); } }
  @keyframes slideUp { from { transform: translateY(40vh) rotate(-1deg); } to { transform: rotate(-1deg); } }
  @keyframes breathe { from { transform: rotate(-1deg) scale(1); } to { transform: rotate(1deg) scale(1.05); } }
  @keyframes float { from { translate: 0 0; } to { translate: 0 -10px; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body class="screen">
<a class="btn back" href="index.html">← หน้าหลัก</a>
<div class="bunting"></div>

<div class="wrap">
  <img class="deco hide-sm" src="img/icons/star.png" alt="" style="width:80px; left:10px; top:6px; transform:rotate(-12deg)">
  <img class="deco hide-sm" src="img/icons/pencil.png" alt="" style="width:90px; right:10px; top:4px; transform:rotate(8deg)">

  <h1><span>ภารกิจแบ่งปันให้เท่ากัน</span></h1>

  <section class="groups" id="groups"></section>

  <div class="q ask">แบ่งให้เท่ากันได้คนละกี่เม็ด?</div>
</div>

<script>
// shades: small shifts that stay inside each colour family
const GROUPS = [
  { n: 9, img: 'btn-pink', c: 'var(--pink)', label: 'กระดุมโทนสีชมพู',
    shades: ['brightness(1)', 'hue-rotate(-14deg) saturate(1.25)', 'hue-rotate(10deg) brightness(1.08)', 'saturate(.7) brightness(1.15)', 'hue-rotate(-6deg) brightness(.88)', 'saturate(1.4) brightness(.95)'] },
  { n: 5, img: 'btn-white', c: '#b9b2c4', label: 'กระดุมโทนสีขาว',
    shades: ['brightness(1)', 'sepia(.3) brightness(1.03)', 'sepia(.2) hue-rotate(170deg) saturate(1.6)', 'brightness(.9)', 'sepia(.4) saturate(1.2) brightness(1.02)'] },
  { n: 7, img: 'btn-orange', c: 'var(--orange)', label: 'กระดุมโทนสีส้ม',
    shades: ['brightness(1)', 'hue-rotate(-10deg) saturate(1.25)', 'hue-rotate(12deg) brightness(1.05)', 'saturate(.75) brightness(1.12)', 'brightness(.86)', 'hue-rotate(-5deg) saturate(1.4)'] },
  { n: 3, img: 'btn-blue', c: 'var(--blue)', label: 'กระดุมโทนสีฟ้า',
    shades: ['hue-rotate(-14deg) saturate(1.3)', 'brightness(1)', 'saturate(1.6) brightness(.9)'] },
];
let t = 0.5; // running start time (s) so groups, then their buttons, appear in order
const html = GROUPS.map((g, k) => {
  const gd = 0.3 + k * 0.2;
  const pile = Array.from({ length: g.n }, (_, i) => {
    t = Math.max(t, 1.3 + k * 0.25) + 0.09;
    const r = ((i + k * 5) * 53) % 40 - 20;
    const f = g.shades[(i * 3 + k) % g.shades.length];
    return `<img src="img/icons/${g.img}.png" alt="" style="--r:${r}deg;--f:${f};--d:${t.toFixed(2)}s">`;
  }).join('');
  return `<div class="group paper" style="--c:${g.c};--gr:${k % 2 ? .8 : -.8}deg;--d:${gd}s" aria-label="${g.label} ${g.n} เม็ด">
    <div class="num" style="--d:${gd + 0.45}s">${g.n}</div>
    <div class="pile">${pile}</div>
  </div>`;
}).join('');
document.getElementById('groups').innerHTML = html;
document.querySelector('.ask').style.setProperty('--d', `${(t + 0.5).toFixed(2)}s`);

// hover or tap a button to spin it. Uses the separate rotate/scale properties so the
// CSS drop/wobble animations on transform keep running (re-setting them would replay the drop)
const spin = e => {
  if (e.target.tagName !== 'IMG' || e.target.getAnimations().some(a => a.id === 'spin')) return;
  e.target.animate([{ rotate: '0deg', scale: 1 }, { rotate: '180deg', scale: 1.25 }, { rotate: '360deg', scale: 1 }],
    { duration: 600, easing: 'ease-in-out', id: 'spin' });
};
document.getElementById('groups').addEventListener('click', spin);
document.getElementById('groups').addEventListener('mouseover', spin);
</script>
</body>
</html>
