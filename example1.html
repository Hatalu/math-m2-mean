<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวอย่าง: ปาร์ตี้ปีใหม่แบ่งขนม | ค่าเฉลี่ย ม.2</title>
<link rel="stylesheet" href="style.css">
<style>
  .story { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1.35fr 1fr;
    grid-template-rows: minmax(0, 1fr); gap: 32px; align-items: center; }
  .story img.scene { max-width: 100%; max-height: 100%; justify-self: center; display: block; border: 12px solid #fff; box-shadow: var(--shadow); transform: rotate(-1deg); }
  .story .paper { position: relative; padding: 2.5vh 28px; font-size: clamp(.95rem, 2.9vh, 1.55rem); line-height: 1.6; transform: rotate(1deg); }
  .story b { color: var(--pink); font-family: 'Mitr'; }
  .q { margin-top: .6em; }
</style>
</head>
<body class="screen">
<a class="btn back" href="index.html">← หน้าหลัก</a>
<div class="bunting"></div>

<div class="wrap">
  <img class="deco hide-sm" src="img/icons/balloons.png" alt="" style="width:110px; left:0; top:20px; transform:rotate(-8deg)">
  <img class="deco hide-sm" src="img/icons/popper.png" alt="" style="width:100px; right:10px; top:20px; transform:scaleX(-1) rotate(-10deg)">

  <h1><span>ตัวอย่าง: ปาร์ตี้ปีใหม่ แบ่งขนม</span></h1>

  <div class="nums">
    <div class="num" style="--c: var(--pink)">4</div>
    <div class="num" style="--c: var(--orange)">6</div>
    <div class="num" style="--c: var(--teal)">8</div>
    <div class="num" style="--c: var(--purple)">10</div>
  </div>

  <section class="story">
    <img class="deco" src="img/icons/snack.png" alt="" style="width:64px; right:-14px; top:-40px; transform:rotate(14deg); z-index:2">
    <img class="deco" src="img/icons/gift.png" alt="" style="width:72px; right:-10px; bottom:-44px; transform:rotate(-8deg); z-index:2">
    <img class="scene" src="img/party.jpg" alt="ภาพกระดาษตัดสีสดใส นักเรียนสี่คนนำถุงขนมมาวางรวมกันบนโต๊ะในงานปีใหม่ที่โรงเรียน">
    <div class="paper">
      ปีใหม่เด็กนักเรียนเอาขนมมาแบ่งกินกันที่โรงเรียน<br>
      คนที่หนึ่งนำขนมมา <b>4 ถุง</b><br>
      คนที่สองนำขนมมา <b>6 ถุง</b><br>
      คนที่สามนำขนมมา <b>8 ถุง</b><br>
      คนที่สี่นำขนมมา <b>10 ถุง</b><br>
      มารวมกันที่โรงเรียนแล้วแบ่งเท่าๆ กัน
      <div class="q">จะได้ขนมเฉลี่ยคนละกี่ถุง?</div>
    </div>
  </section>
</div>
</body>
</html>
