<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตัวอย่าง: ปาร์ตี้ปีใหม่แบ่งขนม | ค่าเฉลี่ย ม.2</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { position: relative; max-width: 1200px; margin: 0 auto; padding: 60px 24px 50px; }
  h1 { text-align: center; font-size: clamp(1.8rem, 4vw, 2.8rem); margin: .2em 0 .8em; }
  h1 span { background: var(--yellow); padding: 0 .5em; display: inline-block; transform: rotate(-1.5deg); box-shadow: var(--shadow); }

  .story { position: relative; display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; align-items: center; }
  .story img.scene { width: 100%; display: block; border: 12px solid #fff; box-shadow: var(--shadow); transform: rotate(-1deg); }
  .story .paper { position: relative; padding: 28px 30px; font-size: clamp(1.2rem, 2vw, 1.55rem); line-height: 1.8; transform: rotate(1deg); }
  .story b { color: var(--pink); font-family: 'Mitr'; }
  .q { margin-top: .7em; background: var(--teal); color: #fff; padding: .4em .8em; font-family: 'Mitr'; font-size: 1.1em; }

  .deco { position: absolute; pointer-events: none; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }

  @media (max-width: 800px) {
    .story { grid-template-columns: 1fr; }
    .deco.hide-sm { display: none; }
  }
</style>
</head>
<body>
<a class="btn back" href="index.html">← หน้าหลัก</a>
<div class="bunting"></div>

<div class="wrap">
  <img class="deco hide-sm" src="img/icons/balloons.png" alt="" style="width:110px; left:0; top:20px; transform:rotate(-8deg)">
  <img class="deco hide-sm" src="img/icons/popper.png" alt="" style="width:100px; right:10px; top:20px; transform:scaleX(-1) rotate(-10deg)">

  <h1><span>ตัวอย่าง: ปาร์ตี้ปีใหม่ แบ่งขนม</span></h1>

  <section class="story">
    <img class="deco" src="img/icons/snack.png" alt="" style="width:64px; right:-14px; top:-40px; transform:rotate(14deg); z-index:2">
    <img class="deco" src="img/icons/gift.png" alt="" style="width:72px; right:-10px; bottom:-44px; transform:rotate(-8deg); z-index:2">
    <img class="scene" src="img/party.jpg" alt="ภาพกระดาษตัดสีสดใส นักเรียนสี่คนนำถุงขนมมาวางรวมกันบนโต๊ะในงานปีใหม่ที่โรงเรียน">
    <div class="paper">
      ปีใหม่เด็กนักเรียนเอาขนมมาแบ่งกินกันที่โรงเรียน<br>
      คนที่หนึ่งนำขนมมา <b>4 ถุง</b><br>
      คนที่สองนำขนมมา <b>6 ถุง</b><br>
      คนที่สามนำขนมมา <b>8 ถุง</b><br>
      คนที่สี่นำขนมมา <b>10 ถุง</b><br>
      มารวมกันที่โรงเรียนแล้วแบ่งเท่าๆ กัน
      <div class="q">จะได้ขนมเฉลี่ยคนละกี่ถุง?</div>
    </div>
  </section>
</div>
</body>
</html>
